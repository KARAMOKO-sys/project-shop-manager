services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-shopai}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-shopai}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-shopai}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-shopai-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-shopai}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-shopai}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-shopai}
      DB_SOCKET: ""
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') !== false ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-shopai}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-shopai}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-shopai}
      DB_SOCKET: ""
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
      NUXT_API_INTERNAL_BASE: http://app:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  app_storage:
